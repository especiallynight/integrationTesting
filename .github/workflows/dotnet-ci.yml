name: .NET Integration Tests CI/CD
 
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
 
jobs:
  build-and-test:
    runs-on: ubuntu-latest
 
    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
 
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
 
    - name: Restore dependencies
      run: |
        find . -name "*.csproj" -exec dotnet restore {} \;
 
    - name: Build Solution
      run: |
        find . -name "*.csproj" -exec dotnet build {} --no-restore --configuration Release \;
 
    - name: Run Integration Tests
      run: |
        find . -name "*Tests*.csproj" -exec dotnet test {} --no-build --configuration Release --verbosity normal \;
